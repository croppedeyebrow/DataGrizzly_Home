name: ci

on:
  pull_request:
  push:

jobs:
  web:
    name: public web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Check public web
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: bash scripts/check.sh
