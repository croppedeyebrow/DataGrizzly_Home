nodeLinker: node-modules
enableScripts: false
enableHardenedMode: true
npmMinimalAgeGate: 3d

# @astrojs/astro2tsx 0.1.3 uses @napi-rs/wasm-runtime but does not publish
# its required @emnapi/runtime peer. Provide that peer without enabling scripts.
packageExtensions:
  "@astrojs/astro2tsx@*":
    dependencies:
      "@emnapi/runtime": "1.11.3"
