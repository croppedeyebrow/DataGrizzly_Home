# 기능: 문서 접수 API의 요청, 응답, 오류, 업무 상태.
# 목적: sourceId, jobId, commandId, reviewVersion을 서로 다른 번호로 고정한다.
# 연관: contracts/ingestion/*.schema.json, services/api/src/ingestion.rs, docs/11_document_workflow/WF04_DATA_API.md.

openapi: 3.0.3
info:
  title: DataGrizzly ingestion
  version: "1"
  description: 관리자 접수와 조회. 그래프 단계와 모델 호출은 이 계약에 없다.
paths:
  /api/admin/imports:
    post:
      operationId: createImport
      summary: 비공개 업로드를 작업으로 접수한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
            example:
              requestId: dddddddd-dddd-4ddd-8ddd-dddddddddddd
              sourceId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
      responses:
        "202":
          description: 새 작업 또는 같은 자료의 기존 작업.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAccepted"
              example:
                jobId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                sourceId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                status: QUEUED
                version: 1
                duplicate: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 같은 requestId에 다른 본문.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"
              example:
                error: conflict
                code: payload_conflict
                jobId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
        "422":
          $ref: "#/components/responses/Invalid"
    get:
      operationId: listImports
      summary: 자신의 작업만 상태와 페이지로 본다.
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/BusinessStatus"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: 소유자 작업 목록. 원문과 object key는 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/admin/imports/{id}:
    get:
      operationId: readImport
      summary: 자신의 작업 상세와 허용 action을 본다.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: jobId. sourceId나 commandId를 여기에 넣지 않는다.
      responses:
        "200":
          description: 업무 상태, 잠금 번호, 검토 번호, 허용 action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
              example:
                jobId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                sourceId: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                status: QUEUED
                version: 1
                reviewVersion: null
                workflowVersion: 1
                threadId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                attempt: 0
                allowedActions: [cancel]
                draftId: null
                errorCode: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 없거나 다른 소유자의 작업. 원문을 포함하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"
  /api/admin/imports/{id}/cancel:
    post:
      operationId: cancelImport
      summary: expectedVersion이 같을 때만 취소 의도를 남긴다.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "202":
          description: 대기 작업은 CANCELLED, 처리 중 작업은 취소 의도만 기록.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 오래된 version이거나 종료 상태.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"
  /api/admin/imports/{id}/retry:
    post:
      operationId: retryImport
      summary: FAILED만 QUEUED로 되돌린다.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "202":
          description: 같은 입력을 다시 대기열에 넣는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: FAILED가 아니거나 version이 오래됐다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportError"
components:
  parameters:
    JobId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: 세션이 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ImportError"
          example:
            error: unauthorized
    Forbidden:
      description: CSRF가 없거나 계정이 꺼져 있다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ImportError"
          example:
            error: forbidden
    NotFound:
      description: 자신의 작업이 아니다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ImportError"
          example:
            error: not_found
    Invalid:
      description: 주소 수집, 공개 파일, 알 수 없는 상태.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ImportError"
  schemas:
    BusinessStatus:
      type: string
      enum: [QUEUED, RUNNING, NEEDS_REVIEW, RESUME_QUEUED, RETRY_WAIT, DRAFT_SAVED, FAILED, REJECTED, CANCELLED]
    ImportRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        url:
          type: string
    VersionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: jobVersion. reviewVersion이나 commandId가 아니다.
    ImportAccepted:
      type: object
      additionalProperties: false
      required: [jobId, sourceId, status, version, duplicate]
      properties:
        jobId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BusinessStatus"
        version:
          type: integer
          minimum: 1
        duplicate:
          type: boolean
    ImportList:
      type: object
      additionalProperties: false
      required: [imports, page, pageSize, total]
      properties:
        imports:
          type: array
          items:
            $ref: "#/components/schemas/ImportSummary"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ImportSummary:
      type: object
      additionalProperties: false
      required: [jobId, sourceId, status, version, updatedAt]
      properties:
        jobId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BusinessStatus"
        version:
          type: integer
        updatedAt:
          type: string
    ImportDetail:
      type: object
      additionalProperties: false
      required: [jobId, sourceId, status, version, reviewVersion, workflowVersion, threadId, attempt, allowedActions]
      properties:
        jobId:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BusinessStatus"
        version:
          type: integer
          description: 업무 행의 낙관 잠금 번호.
        reviewVersion:
          type: integer
          nullable: true
          description: 저장된 검토 명령의 번호. 그래프 state가 아니다.
        commandId:
          type: string
          format: uuid
          nullable: true
          description: 아직 저장된 검토 명령이 없으면 null.
        workflowVersion:
          type: integer
        threadId:
          type: string
          format: uuid
          description: 체크포인트 thread. 값은 jobId와 같다.
        attempt:
          type: integer
        allowedActions:
          type: array
          items:
            type: string
            enum: [cancel, retry]
        draftId:
          type: string
          format: uuid
          nullable: true
        errorCode:
          type: string
          nullable: true
    ImportError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [unauthorized, forbidden, not_found, invalid, conflict, unavailable]
        code:
          type: string
          enum: [url_not_accepted, source_required, private_source, source_not_ready, payload_conflict, stale_version, illegal_transition, invalid_status]
        jobId:
          type: string
          format: uuid
        version:
          type: integer
        status:
          $ref: "#/components/schemas/BusinessStatus"
