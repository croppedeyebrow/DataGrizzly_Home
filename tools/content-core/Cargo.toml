[package]
name = "content-core"
version = "0.1.0"
edition = "2021"
publish = false

# 개념: 본문 검사 라이브러리.
# 목적: 블록을 거절하거나 절과 청크로 나누되, 프로세스 종료와 파일 시스템에 의존하지 않는다.
# 사용처: tools/content-cli 의 dg-content, 편집기의 선택적 사전 검사.
# 관련: services/api/src/content.rs 의 저장 검사, apps/admin/src/editor/Editor.tsx 의 anchorFrom.

[dependencies]
serde_json = "1"
sha2 = "0.10"
