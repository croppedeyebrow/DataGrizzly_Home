[package]
name = "content-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# 개념: 브라우저로 넘길 수 있는 순수 검사.
# 실행: 이 크레이트는 파일과 DOM을 쓰지 않는다. wasm32 타깃이 없어 브라우저 모듈은 빌드하지 않았다.
# 목적: 같은 검사 함수를 네이티브에서 고정하고, 모듈이 없을 때는 편집기가 서버 검사를 쓰게 둔다.
# 관련: tools/content-core, apps/admin/src/editor/wasm-check.ts.

[dependencies]
content-core = { path = "../content-core" }
serde_json = "1"
